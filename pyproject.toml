[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extremarank"
version = "0.2.0"
description = "Sample-deletion robustness audits for paired and independent-group omics rankings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["bioinformatics", "omics", "robustness", "paired-data", "Welch", "exact-optimization"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]
dependencies = []

[project.urls]
Repository = "https://github.com/heise3/ExtremaRank"
Issues = "https://github.com/heise3/ExtremaRank/issues"

[project.optional-dependencies]
benchmark = ["numpy>=1.24,<3"]

[project.scripts]
extremarank = "extremarank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
